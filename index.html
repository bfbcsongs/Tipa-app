<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Audio Editor</title>

<!-- Include Tone.js for PitchShift processing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
}

.card {
    background: #1e293b;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #334155;
    color: white;
    border-radius: 10px;
}

.song-name {
    margin-top: 12px;
    font-weight: bold;
    word-break: break-word;
}

audio {
    width: 100%;
    margin-top: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

button {
    flex: 1;
    min-width: 120px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button.secondary {
    background: #475569;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.control {
    margin: 20px 0;
}

.control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.control-value {
    font-weight: bold;
    font-size: 18px;
}

input[type="range"] {
    width: 100%;
}

.status {
    text-align: center;
    color: #94a3b8;
    margin-top: 15px;
    min-height: 22px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎵 Audio Editor</h1>

    <div class="subtitle">
        Pitch & Tempo — Independent Control
    </div>

    <div class="card">
        <input type="file" id="audioFile" accept="audio/*">
        <div class="song-name" id="songName">No audio selected</div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <div class="card">
        <div class="control">
            <div class="control-header">
                <span>🎼 Pitch</span>
                <span class="control-value" id="pitchValue">0 semitones</span>
            </div>
            <input type="range" id="pitch" min="-12" max="12" step="1" value="0">
        </div>

        <div class="control">
            <div class="control-header">
                <span>🕐 Tempo</span>
                <span class="control-value" id="tempoValue">100%</span>
            </div>
            <input type="range" id="tempo" min="50" max="150" step="1" value="100">
        </div>
    </div>

    <div class="card">
        <div class="buttons">
            <button id="resetButton" class="secondary">Reset</button>
        </div>
        <div class="status" id="status">Select an audio file to begin.</div>
    </div>

</div>

<script>
let audioCtx = null;
let sourceNode = null;
let pitchShift = null;
let isConnected = false;

const audioFile = document.getElementById("audioFile");
const audioPlayer = document.getElementById("audioPlayer");
const songName = document.getElementById("songName");
const pitch = document.getElementById("pitch");
const tempo = document.getElementById("tempo");
const pitchValue = document.getElementById("pitchValue");
const tempoValue = document.getElementById("tempoValue");
const resetButton = document.getElementById("resetButton");
const statusDiv = document.getElementById("status");

audioFile.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;

    songName.textContent = file.name;
    audioPlayer.src = URL.createObjectURL(file);
    statusDiv.textContent = "Audio loaded. Press play on the player.";
});

// Setup Web Audio routing when user hits play
audioPlayer.addEventListener("play", async () => {
    if (!audioCtx) {
        audioCtx = Tone.context;
    }
    
    if (audioCtx.state !== "running") {
        await audioCtx.resume();
    }

    if (!isConnected) {
        try {
            // Connect native audio element element into Tone.js PitchShift effect graph
            pitchShift = new Tone.PitchShift({
                pitch: Number(pitch.value),
                windowSize: 0.1
            }).toDestination();

            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            sourceNode.connect(pitchShift);
            isConnected = true;
        } catch (e) {
            console.log("Audio routing error:", e);
        }
    }
    
    statusDiv.textContent = "Playing...";
});

audioPlayer.addEventListener("pause", () => {
    statusDiv.textContent = "Paused.";
});

// Independent Pitch Control
pitch.addEventListener("input", function () {
    const semitones = Number(this.value);
    pitchValue.textContent = (semitones > 0 ? "+" : "") + semitones + " semitones";
    
    if (pitchShift) {
        pitchShift.pitch = semitones;
    }
});

// Independent Tempo Control (Changes speed using native playbackRate without affecting pitch shift node)
tempo.addEventListener("input", function () {
    const val = Number(this.value);
    tempoValue.textContent = val + "%";
    audioPlayer.playbackRate = val / 100;
});

// Reset Controls
resetButton.addEventListener("click", () => {
    pitch.value = 0;
    tempo.value = 100;
    pitchValue.textContent = "0 semitones";
    tempoValue.textContent = "100%";

    if (pitchShift) pitchShift.pitch = 0;
    audioPlayer.playbackRate = 1;

    statusDiv.textContent = "Controls reset.";
});
</script>

</body>
</html>
