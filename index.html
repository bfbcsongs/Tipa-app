<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Chordify Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; padding: 16px; min-height: 100vh; }
    .container { max-width: 440px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .title { font-size: 1rem; font-weight: 700; color: #818cf8; }
    .badge { font-size: 0.65rem; background: #1e1b4b; color: #a5b4fc; border: 1px solid #3730a3; padding: 2px 8px; border-radius: 99px; font-family: monospace; }
    
    .card { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); position: relative; }
    .label { font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; display: block; }
    
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #020617; border: 1px solid #1e293b; color: #fff; padding: 8px 12px; font-size: 0.8rem; border-radius: 8px; outline: none; }
    input[type="text"]:focus { border-color: #6366f1; }
    
    .btn-primary { background: #4f46e5; color: #fff; font-weight: 700; font-size: 0.8rem; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .btn-secondary { background: #0f172a; border: 1px solid #1e293b; color: #cbd5e1; font-size: 0.75rem; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
    
    .suggestions-box { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 50; }
    .suggestion-item { padding: 10px 12px; font-size: 0.8rem; border-bottom: 1px solid #1e293b; cursor: pointer; color: #cbd5e1; }
    .suggestion-item:hover { background: #4f46e5; color: #fff; }
    
    .hidden { display: none !important; }
    
    .results-box { margin-top: 10px; }
    .video-item { background: #020617; border: 1px solid #1e293b; padding: 8px; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .video-title { font-size: 0.75rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
    .video-author { font-size: 0.65rem; color: #94a3b8; }
    .play-badge { font-size: 0.7rem; color: #818cf8; font-weight: 700; background: rgba(99, 102, 241, 0.1); padding: 4px 8px; border-radius: 4px; }
    
    .player-controls { display: flex; justify-content: space-between; align-items: center; background: #020617; border: 1px solid #1e293b; padding: 8px; border-radius: 8px; margin-top: 8px; font-size: 0.75rem; }
    .ctrl-group { display: flex; align-items: center; gap: 6px; }
    .ctrl-btn { background: #1e293b; border: none; color: #fff; font-weight: 700; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
    
    .chord-block { display: inline-block; font-weight: 700; font-size: 0.85rem; color: #818cf8; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); padding: 2px 6px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; }
    .canvas { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; min-height: 250px; }
    .empty-state { text-align: center; color: #64748b; padding: 40px 0; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <div class="title">🎸 PWA Chordify Lab</div>
      <div class="badge">DEV LAB</div>
    </div>

    <!-- Search Section -->
    <div class="card">
      <span class="label">Connect YouTube Track</span>
      <div class="input-group">
        <input 
          type="text" 
          id="yt-search-input" 
          placeholder="Type song title (e.g. Pusong Basag)..." 
          oninput="handleSearchSuggestions()"
          onkeyup="if(event.key==='Enter') searchYouTubeDirect()"
          autocomplete="off"
        />
        <button onclick="searchYouTubeDirect()" class="btn-primary">Search</button>
      </div>

      <div id="yt-suggestions" class="suggestions-box hidden"></div>
      <div id="yt-video-results" class="results-box hidden"></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button onclick="loadDemoSong()" class="btn-secondary">✨ Load Demo Track</button>
      <button onclick="clearCanvas()" class="btn-secondary">🔄 Reset Sheet</button>
    </div>

    <!-- Audio Player Container -->
    <div id="yt-player-container" class="card hidden"></div>

    <!-- Chord Canvas -->
    <div id="chord-canvas" class="canvas">
      <div class="empty-state">
        <p>Type a song title above or tap <strong>Load Demo Track</strong>!</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
