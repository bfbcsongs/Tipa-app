<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Chordify Lab</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background-color: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
    .chord-block {
      display: inline-block; font-weight: 700; font-size: 0.85rem; color: #6366f1;
      background-color: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 2px 6px; border-radius: 6px; margin-bottom: 2px; cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">

  <div class="max-w-md mx-auto p-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-base font-bold text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-guitar"></i> PWA Chordify Lab
      </h1>
      <span class="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded-full font-mono">DEV LAB</span>
    </div>

    <!-- 1. Search Bar with Live Suggestions Dropdown -->
    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl mb-4 shadow-lg relative">
      <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">
        <i class="fa-brands fa-youtube text-red-500 mr-1"></i> Connect YouTube Track
      </label>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="yt-search-input" 
          placeholder="Type song title (e.g. Pusong Basag)..." 
          class="w-full bg-slate-950 border border-slate-800 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
          oninput="handleSearchSuggestions()"
          onkeyup="if(event.key==='Enter') searchYouTubeDirect()"
          autocomplete="off"
        />
        <button 
          onclick="searchYouTubeDirect()" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors flex items-center gap-1">
          <span>Search</span>
        </button>
      </div>

      <!-- Live Suggestions Container -->
      <div id="yt-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-lg shadow-xl hidden z-50 max-h-48 overflow-y-auto"></div>
    </div>

    <!-- 2. Quick Action Toolbar -->
    <div class="flex gap-2 mb-4">
      <button onclick="loadDemoSong()" class="bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Load Demo Track
      </button>
      <button onclick="clearCanvas()" class="bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-rotate-left text-slate-400"></i> Reset Sheet
      </button>
    </div>

    <!-- 3. Dynamic Audio Player -->
    <div id="yt-player-container" class="mb-4 hidden"></div>

    <!-- 4. Interactive Sheet -->
    <div id="chord-canvas" class="bg-slate-900 border border-slate-800 rounded-xl p-4 min-h-[300px]">
      <div class="text-center py-12 text-slate-500">
        <i class="fa-solid fa-music text-3xl mb-2 block text-slate-700"></i>
        <p class="text-xs">Type a song title above or tap <strong>Load Demo Track</strong>!</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
