<!-- 1. Search Bar with Suggestions & Results -->
    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl mb-4 shadow-lg relative">
      <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">
        <i class="fa-brands fa-youtube text-red-500 mr-1"></i> Connect YouTube Track
      </label>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="yt-search-input" 
          placeholder="Type song title (e.g. Pusong Basag)..." 
          class="w-full bg-slate-950 border border-slate-800 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
          oninput="handleSearchSuggestions()"
          onkeyup="if(event.key==='Enter') searchYouTubeDirect()"
          autocomplete="off"
        />
        <button 
          onclick="searchYouTubeDirect()" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors flex items-center gap-1">
          <span>Search</span>
        </button>
      </div>

      <!-- Live Word Suggestions -->
      <div id="yt-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-lg shadow-xl hidden z-50 max-h-48 overflow-y-auto"></div>
      
      <!-- Video Results Picker -->
      <div id="yt-video-results" class="mt-3 space-y-2 hidden"></div>
    </div>
