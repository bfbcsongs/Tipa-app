<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Audio Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
}

.card {
    background: #1e293b;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #334155;
    color: white;
    border-radius: 10px;
}

.song-name {
    margin-top: 12px;
    font-weight: bold;
    word-break: break-word;
}

.control {
    margin: 20px 0;
}

.control-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.control-value {
    font-weight: bold;
    font-size: 18px;
}

input[type="range"] {
    width: 100%;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    flex: 1;
    min-width: 120px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button.secondary {
    background: #475569;
}

button:disabled {
    opacity: 0.5;
}

.status {
    text-align: center;
    color: #94a3b8;
    margin-top: 15px;
    min-height: 22px;
}

.note {
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 Audio Editor</h1>

<div class="subtitle">
Tempo Test — Pitch Preserved
</div>


<div class="card">

<input
    type="file"
    id="audioFile"
    accept="audio/mpeg,audio/wav,audio/*"
>

<div
    class="song-name"
    id="songName">
    No audio selected
</div>

</div>


<div class="card">

<div class="control">

<div class="control-header">

<span>🕐 Tempo</span>

<span
    class="control-value"
    id="tempoValue">
    100%
</span>

</div>

<input
    type="range"
    id="tempo"
    min="50"
    max="150"
    step="1"
    value="100"
>

</div>

</div>


<div class="card">

<div class="buttons">

<button
    id="playButton"
    disabled>
    ▶ Play
</button>

<button
    id="stopButton"
    class="secondary"
    disabled>
    ■ Stop
</button>

</div>


<br>


<div class="buttons">

<button
    id="resetButton"
    class="secondary">
    Reset
</button>

</div>


<div
    class="status"
    id="status">
    Select an audio file.
</div>

</div>


<div class="card">

<div class="note">

<b>V2-A Test</b><br><br>

Tempo changes should make the audio slower or faster
while keeping the original musical pitch.

<br><br>

Pitch control will be added only after this test works.

</div>

</div>

</div>


<script>

const audioFile =
    document.getElementById("audioFile");

const songName =
    document.getElementById("songName");

const tempo =
    document.getElementById("tempo");

const tempoValue =
    document.getElementById("tempoValue");

const playButton =
    document.getElementById("playButton");

const stopButton =
    document.getElementById("stopButton");

const resetButton =
    document.getElementById("resetButton");

const status =
    document.getElementById("status");


let audioContext = null;
let audioBuffer = null;

let sourceNode = null;
let processorNode = null;

let currentFile = null;


/* --------------------------------
   LOAD AUDIO
-------------------------------- */

audioFile.addEventListener(
    "change",
    async function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        try {

            currentFile = file;

            songName.textContent =
                file.name;

            status.textContent =
                "Loading audio...";

            if (!audioContext) {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            }

            const data =
                await file.arrayBuffer();

            audioBuffer =
                await audioContext.decodeAudioData(
                    data
                );

            playButton.disabled = false;
            stopButton.disabled = false;

            status.textContent =
                "Audio loaded.";

        } catch (error) {

            console.error(error);

            status.textContent =
                "Could not load audio.";

        }

    }
);


/* --------------------------------
   PLAY
-------------------------------- */

playButton.addEventListener(
    "click",
    async function () {

        if (!audioBuffer) {
            return;
        }

        await audioContext.resume();

        stopCurrentAudio();


        sourceNode =
            audioContext.createBufferSource();


        sourceNode.buffer =
            audioBuffer;


        /*
         * IMPORTANT:
         *
         * For this first test we use the
         * browser's native pitch-preserving
         * playback behavior.
         *
         * playbackRate changes timing,
         * while preservesPitch keeps pitch.
         */

        const rate =
            Number(tempo.value) / 100;


        sourceNode.playbackRate.value =
            rate;


        /*
         * Tell browser to preserve pitch.
         */

        if ("preservesPitch" in sourceNode) {
            sourceNode.preservesPitch = true;
        }


        sourceNode.connect(
            audioContext.destination
        );


        sourceNode.start(0);


        status.textContent =
            "Playing at " +
            tempo.value +
            "% tempo.";

    }
);


/* --------------------------------
   STOP
-------------------------------- */

stopButton.addEventListener(
    "click",
    function () {

        stopCurrentAudio();

        status.textContent =
            "Stopped.";

    }
);


/* --------------------------------
   STOP CURRENT
-------------------------------- */

function stopCurrentAudio() {

    if (sourceNode) {

        try {
            sourceNode.stop();
        } catch (e) {}

        try {
            sourceNode.disconnect();
        } catch (e) {}

        sourceNode = null;

    }

}


/* --------------------------------
   TEMPO
-------------------------------- */

tempo.addEventListener(
    "input",
    function () {

        const value =
            Number(this.value);

        tempoValue.textContent =
            value + "%";


        /*
         * If currently playing,
         * change speed immediately.
         */

        if (sourceNode) {

            sourceNode.playbackRate.value =
                value / 100;

        }

    }
);


/* --------------------------------
   RESET
-------------------------------- */

resetButton.addEventListener(
    "click",
    function () {

        tempo.value = 100;

        tempoValue.textContent =
            "100%";


        if (sourceNode) {

            sourceNode.playbackRate.value =
                1;

        }

        status.textContent =
            "Tempo reset to 100%.";

    }
);

</script>

</body>
</html></body>
</html>
