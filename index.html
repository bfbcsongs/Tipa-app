<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA MASTER - Time-Synced Chords</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
    .chord-tile {
      transition: all 0.2s ease;
    }
    .chord-active {
      background-color: #4f46e5 !important;
      color: #ffffff !important;
      border-color: #818cf8 !important;
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <h1 class="text-base font-bold text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-guitar"></i> PWA MASTER
      </h1>
      <span class="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded-full font-mono">CHORDIFY SYNC</span>
    </div>

    <!-- Audio Input -->
    <div class="bg-slate-800 border border-slate-700/80 p-3.5 rounded-2xl shadow-lg space-y-2">
      <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">
        Select Local MP3 File
      </label>
      <input 
        type="file" 
        id="audio-input" 
        accept="audio/*"
        onchange="loadAudioTrack(event)"
        class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"
      />
    </div>

    <!-- Player Block -->
    <div id="player-card" class="hidden bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl space-y-4">
      <p id="track-name" class="text-xs font-bold text-indigo-300 truncate">No Audio Selected</p>
      
      <audio id="main-audio" controls class="w-full h-8"></audio>

      <!-- Active Chord Spotlight (Chordify Feature) -->
      <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 text-center">
        <span class="text-[10px] text-slate-400 uppercase font-bold tracking-widest block mb-1">Current Chord</span>
        <div id="current-chord-display" class="text-4xl font-extrabold text-indigo-400 font-mono">--</div>
      </div>

      <!-- Timeline Chord Grid -->
      <div id="chord-timeline" class="grid grid-cols-4 gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700/80 max-h-48 overflow-y-auto">
        <!-- Timed tiles inserted here -->
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
