<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Audio Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
}

.card {
    background: #1e293b;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #334155;
    color: white;
    border-radius: 10px;
}

.song-name {
    margin-top: 12px;
    font-weight: bold;
    word-break: break-word;
}

.control {
    margin: 20px 0;
}

.control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.control-value {
    font-weight: bold;
    font-size: 18px;
}

input[type="range"] {
    width: 100%;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    flex: 1;
    min-width: 120px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button.secondary {
    background: #475569;
}

button.export {
    background: #16a34a;
}

button:disabled {
    opacity: 0.5;
}

.status {
    text-align: center;
    color: #94a3b8;
    margin-top: 15px;
    min-height: 22px;
}

.info {
    background: #334155;
    padding: 12px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
    color: #cbd5e1;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 Audio Editor</h1>

<div class="subtitle">
Independent Pitch & Tempo
</div>


<div class="card">

<input
    type="file"
    id="audioFile"
    accept="audio/mpeg,audio/wav,audio/*"
>

<div
    class="song-name"
    id="songName">
    No audio selected
</div>

</div>


<div class="card">

<div class="control">

<div class="control-header">
<span>🎼 Pitch</span>

<span
    class="control-value"
    id="pitchValue">
    0 semitones
</span>
</div>

<input
    type="range"
    id="pitch"
    min="-12"
    max="12"
    step="1"
    value="0"
>

</div>


<div class="control">

<div class="control-header">
<span>🕐 Tempo</span>

<span
    class="control-value"
    id="tempoValue">
    100%
</span>
</div>

<input
    type="range"
    id="tempo"
    min="50"
    max="150"
    step="1"
    value="100"
>

</div>

</div>


<div class="card">

<div class="buttons">

<button
    id="playButton"
    disabled>
    ▶ Play
</button>

<button
    id="stopButton"
    class="secondary"
    disabled>
    ■ Stop
</button>

</div>

<br>

<div class="buttons">

<button
    id="resetButton"
    class="secondary">
    Reset
</button>

<button
    id="exportButton"
    class="export"
    disabled>
    Export
</button>

</div>

<div
    class="status"
    id="status">
    Select an audio file.
</div>

</div>


<div class="card">

<div class="info">

<b>Engine test</b><br><br>

Pitch changes the musical key without intentionally
changing the tempo.<br><br>

Tempo changes playback speed without intentionally
changing the musical key.

</div>

</div>

</div>


<script type="module">

/*
    SoundTouchJS
    Browser audio processing engine
*/

import {
    PitchShifter
} from "https://cdn.jsdelivr.net/npm/soundtouchjs@0.3.0/dist/soundtouch.js";


/* ELEMENTS */

const audioFile =
    document.getElementById("audioFile");

const songName =
    document.getElementById("songName");

const pitch =
    document.getElementById("pitch");

const tempo =
    document.getElementById("tempo");

const pitchValue =
    document.getElementById("pitchValue");

const tempoValue =
    document.getElementById("tempoValue");

const playButton =
    document.getElementById("playButton");

const stopButton =
    document.getElementById("stopButton");

const resetButton =
    document.getElementById("resetButton");

const exportButton =
    document.getElementById("exportButton");

const status =
    document.getElementById("status");


/* AUDIO */

const audioContext =
    new (window.AudioContext ||
         window.webkitAudioContext)();

let audioBuffer = null;
let shifter = null;

let playing = false;


/* LOAD FILE */

audioFile.addEventListener(
    "change",
    async function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        try {

            status.textContent =
                "Loading audio...";

            songName.textContent =
                file.name;

            const arrayBuffer =
                await file.arrayBuffer();

            audioBuffer =
                await audioContext.decodeAudioData(
                    arrayBuffer
                );

            createShifter();

            playButton.disabled = false;
            stopButton.disabled = false;
            exportButton.disabled = false;

            status.textContent =
                "Audio loaded successfully.";

        } catch (error) {

            console.error(error);

            status.textContent =
                "Could not load this audio file.";

        }

    }
);


/* CREATE PROCESSOR */

function createShifter() {

    if (!audioBuffer) {
        return;
    }

    if (shifter) {

        try {
            shifter.disconnect();
        } catch (e) {}

    }

    /*
        16384 = processing buffer size.
        Larger buffer = more stable processing.
    */

    shifter =
        new PitchShifter(
            audioContext,
            audioBuffer,
            16384
        );


    /*
        Apply current settings
    */

    shifter.tempo =
        Number(tempo.value) / 100;

    shifter.pitchSemitones =
        Number(pitch.value);

}


/* PLAY */

playButton.addEventListener(
    "click",
    async function () {

        if (!shifter) {
            return;
        }

        await audioContext.resume();

        /*
            Reconnect processor
        */

        try {
            shifter.disconnect();
        } catch (e) {}

        shifter.connect(
            audioContext.destination
        );

        playing = true;

        status.textContent =
            "Playing processed audio...";

    }
);


/* STOP */

stopButton.addEventListener(
    "click",
    function () {

        if (!shifter) {
            return;
        }

        try {
            shifter.disconnect();
        } catch (e) {}

        playing = false;

        status.textContent =
            "Stopped.";

    }
);


/* PITCH */

pitch.addEventListener(
    "input",
    function () {

        const value =
            Number(this.value);

        if (value === 0) {

            pitchValue.textContent =
                "0 semitones";

        } else if (value > 0) {

            pitchValue.textContent =
                "+" + value +
                " semitones";

        } else {

            pitchValue.textContent =
                value +
                " semitones";

        }


        if (shifter) {

            /*
                Pitch changes only.
            */

            shifter.pitchSemitones =
                value;

            /*
                Keep tempo exactly where
                the user selected it.
            */

            shifter.tempo =
                Number(tempo.value) / 100;

        }

    }
);


/* TEMPO */

tempo.addEventListener(
    "input",
    function () {

        const value =
            Number(this.value);

        tempoValue.textContent =
            value + "%";


        if (shifter) {

            /*
                Tempo changes only.
            */

            shifter.tempo =
                value / 100;

            /*
                Re-apply pitch so the
                selected key remains active.
            */

            shifter.pitchSemitones =
                Number(pitch.value);

        }

    }
);


/* RESET */

resetButton.addEventListener(
    "click",
    function () {

        pitch.value = 0;
        tempo.value = 100;

        pitchValue.textContent =
            "0 semitones";

        tempoValue.textContent =
            "100%";


        if (shifter) {

            shifter.pitchSemitones = 0;
            shifter.tempo = 1;

        }

        status.textContent =
            "Settings reset.";

    }
);


/* EXPORT PLACEHOLDER */

exportButton.addEventListener(
    "click",
    function () {

        status.textContent =
            "Export engine is the next stage.";

    }
);

</script>

</body>
</html>
