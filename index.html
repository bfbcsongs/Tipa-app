<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Audio Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
}

.card {
    background: #1e293b;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #334155;
    color: white;
    border-radius: 10px;
}

.song-name {
    margin-top: 12px;
    font-weight: bold;
    word-break: break-word;
}

audio {
    width: 100%;
    margin-top: 15px;
}

.control {
    margin: 20px 0;
}

.control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.control-value {
    font-weight: bold;
    font-size: 18px;
}

input[type="range"] {
    width: 100%;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    flex: 1;
    min-width: 120px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button.secondary {
    background: #475569;
}

button.export {
    background: #16a34a;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.status {
    text-align: center;
    color: #94a3b8;
    margin-top: 15px;
    min-height: 22px;
}

.note {
    font-size: 13px;
    line-height: 1.5;
    color: #94a3b8;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎵 Audio Editor</h1>

    <div class="subtitle">
        Pitch & Tempo — Independent Control
    </div>

    <div class="card">

        <input
            type="file"
            id="audioFile"
            accept="audio/mpeg,audio/wav,audio/*"
        >

        <div class="song-name" id="songName">
            No audio selected
        </div>

        <audio
            id="audioPlayer"
            controls
        ></audio>

    </div>


    <div class="card">

        <div class="control">

            <div class="control-header">
                <span>🎼 Pitch</span>
                <span class="control-value"
                      id="pitchValue">
                    0 semitones
                </span>
            </div>

            <input
                type="range"
                id="pitch"
                min="-12"
                max="12"
                step="1"
                value="0"
            >

        </div>


        <div class="control">

            <div class="control-header">
                <span>🕐 Tempo</span>
                <span class="control-value"
                      id="tempoValue">
                    100%
                </span>
            </div>

            <input
                type="range"
                id="tempo"
                min="50"
                max="150"
                step="1"
                value="100"
            >

        </div>

    </div>


    <div class="card">

        <div class="buttons">

            <button
                id="resetButton"
                class="secondary">
                Reset
            </button>

            <button
                id="exportButton"
                class="export"
                disabled>
                Export Audio
            </button>

        </div>

        <div
            class="status"
            id="status">
            Select an audio file to begin.
        </div>

        <div class="note">
            Pitch and tempo controls are designed as
            independent parameters. The actual processing
            engine will be added in the next stage.
        </div>

    </div>

</div>


<script>

const audioFile = document.getElementById("audioFile");
const audioPlayer = document.getElementById("audioPlayer");

const songName = document.getElementById("songName");

const pitch = document.getElementById("pitch");
const tempo = document.getElementById("tempo");

const pitchValue = document.getElementById("pitchValue");
const tempoValue = document.getElementById("tempoValue");

const resetButton = document.getElementById("resetButton");
const exportButton = document.getElementById("exportButton");

const status = document.getElementById("status");

let audioURL = null;
let selectedFile = null;


/* -------------------------
   FILE SELECTION
------------------------- */

audioFile.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    selectedFile = file;

    if (audioURL) {
        URL.revokeObjectURL(audioURL);
    }

    audioURL = URL.createObjectURL(file);

    audioPlayer.src = audioURL;

    songName.textContent = file.name;

    exportButton.disabled = false;

    status.textContent =
        "Audio loaded successfully.";

});


/* -------------------------
   PITCH DISPLAY
------------------------- */

pitch.addEventListener("input", function () {

    const value = Number(this.value);

    if (value === 0) {
        pitchValue.textContent =
            "0 semitones";
    }
    else if (value > 0) {
        pitchValue.textContent =
            "+" + value + " semitones";
    }
    else {
        pitchValue.textContent =
            value + " semitones";
    }

});


/* -------------------------
   TEMPO DISPLAY
------------------------- */

tempo.addEventListener("input", function () {

    tempoValue.textContent =
        this.value + "%";

});


/* -------------------------
   RESET
------------------------- */

resetButton.addEventListener("click", function () {

    pitch.value = 0;
    tempo.value = 100;

    pitchValue.textContent =
        "0 semitones";

    tempoValue.textContent =
        "100%";

    status.textContent =
        "Controls reset.";

});


/* -------------------------
   EXPORT
------------------------- */

exportButton.addEventListener("click", function () {

    if (!selectedFile) {
        return;
    }

    status.textContent =
        "Export engine coming in the next stage.";

});


</script>

</body>
</html>
