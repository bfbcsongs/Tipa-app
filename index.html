<!-- 1. YouTube Audio Input Bar -->
    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl mb-4 shadow-lg">
      <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">
        <i class="fa-brands fa-youtube text-red-500 mr-1"></i> Connect YouTube Track
      </label>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="yt-search-input" 
          placeholder="Type song title (e.g. Lead Me Lord)..." 
          class="w-full bg-slate-950 border border-slate-800 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
          onkeyup="if(event.key==='Enter') searchYouTubeDirect()"
        />
        <button 
          onclick="searchYouTubeDirect()" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors flex items-center gap-1">
          <span>Search</span>
        </button>
      </div>
      <div id="yt-search-results" class="mt-2 space-y-1 hidden"></div>
    </div>
