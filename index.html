<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Chordify Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
    .chord-block {
      display: inline-block; font-weight: 700; font-size: 0.85rem; color: #818cf8;
      background-color: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 2px 6px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <h1 class="text-base font-bold text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-guitar"></i> PWA Chordify Lab
      </h1>
      <span class="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded-full font-mono">BFBC SYNC</span>
    </div>

    <!-- Search / URL Input Card -->
    <div class="bg-slate-800 border border-slate-700/80 p-3.5 rounded-2xl shadow-lg relative space-y-2">
      <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-brands fa-youtube text-red-500 text-sm"></i> YouTube Video Sync
      </label>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="yt-search-input" 
          placeholder="Paste YouTube Link or Type Title..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 shadow-inner"
          oninput="handleSearchSuggestions()"
          onkeyup="if(event.key==='Enter') processMediaInput()"
          autocomplete="off"
        />
        <button 
          onclick="processMediaInput()" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-md flex items-center gap-1 cursor-pointer">
          <span>Load</span>
        </button>
      </div>

      <!-- Live Search Suggestions -->
      <div id="yt-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl hidden z-50 max-h-48 overflow-y-auto"></div>
    </div>

    <!-- Action Toolbar -->
    <div class="flex gap-2">
      <button onclick="loadDemoSong()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 transition cursor-pointer">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Load Demo Track
      </button>
      <button onclick="clearCanvas()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 transition cursor-pointer">
        <i class="fa-solid fa-rotate-left text-slate-400"></i> Reset Sheet
      </button>
    </div>

    <!-- Dynamic Audio Player -->
    <div id="yt-player-container" class="hidden"></div>

    <!-- Interactive Sheet Container -->
    <div id="chord-canvas" class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 min-h-[300px] shadow-lg">
      <div class="text-center py-12 text-slate-500">
        <i class="fa-solid fa-music text-3xl mb-2 block text-slate-600"></i>
        <p class="text-xs">Paste a YouTube URL or tap <strong>Load Demo Track</strong>!</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
